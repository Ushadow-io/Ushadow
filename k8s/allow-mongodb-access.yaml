apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ushadow-to-mongodb
  namespace: root
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ushadow
      ports:
        - protocol: TCP
          port: 27017
