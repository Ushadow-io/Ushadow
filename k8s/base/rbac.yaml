apiVersion: v1
kind: ServiceAccount
metadata:
  name: ushadow-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ushadow-backend-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ushadow-backend-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ushadow-backend-reader
subjects:
  - kind: ServiceAccount
    name: ushadow-backend
