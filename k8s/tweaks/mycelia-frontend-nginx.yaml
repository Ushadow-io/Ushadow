---
# Mycelia frontend nginx proxy config
#
# Why this exists:
#   The upstream `ghcr.io/ushadow-io/mycelia/frontend:latest` image ships
#   stock nginx with the default /etc/nginx/conf.d/default.conf — no
#   proxy_pass for /api, /oauth, /ws. The mycelia SPA makes same-origin
#   API calls (e.g. POST /oauth/token), which fall through to the static
#   handler and return 405. Result: fresh browser sessions can't
#   authenticate ("setup screen won't accept tokens").
#
# What this does:
#   Replaces /etc/nginx/conf.d/default.conf via a ConfigMap mount with a
#   config that:
#     - serves the SPA from /usr/share/nginx/html with history-mode fallback
#     - proxies /api, /oauth, /ws to mycelia-backend:5173 (cluster DNS)
#     - upgrades websockets correctly for /ws
#
# How to apply:
#   kubectl apply -f k8s/tweaks/mycelia-frontend-nginx.yaml
#   kubectl rollout restart deployment/mycelia-frontend -n ushadow
#
# Re-applying after ushadow redeploys mycelia-frontend:
#   ushadow's K8s manifest builder doesn't know about this tweak, so a
#   redeploy will reset the Deployment spec (dropping the volume mount).
#   The ConfigMap survives, but you'll need to re-patch the Deployment.
#   See docs/MYCELIA-FRONTEND-NGINX-PROXY.md for the durable fix.

apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelia-frontend-nginx
  namespace: ushadow
  labels:
    app.kubernetes.io/name: mycelia-frontend
    app.kubernetes.io/managed-by: ushadow-tweak
data:
  # Replaces /etc/nginx/nginx.conf. The upstream image bakes its server
  # block directly into nginx.conf (not into conf.d/), so a conf.d override
  # is silently ignored. We replicate the upstream static-file behaviour
  # verbatim and prepend proxy rules for /api, /oauth, /ws.
  nginx.conf: |
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        sendfile        on;
        tcp_nopush      on;
        tcp_nodelay     on;
        keepalive_timeout  65;
        server_tokens off;

        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        # WebSocket upgrade map (used by /ws location below)
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        # Cache control for SPA assets
        map $sent_http_content_type $cache_control_header {
            default                              "no-cache";
            ~*text/html                          "no-cache";
            ~*application/json                   "no-cache";
            ~*text/css                           "public, max-age=31536000, immutable";
            ~*application/javascript             "public, max-age=31536000, immutable";
            ~*font/                              "public, max-age=31536000, immutable";
            ~*image/                             "public, max-age=31536000, immutable";
            ~*image/svg+xml                      "public, max-age=31536000, immutable";
        }

        server {
            listen 8080;
            listen [::]:8080;

            access_log  /var/log/nginx/access.log  main;

            root /usr/share/nginx/html;
            index index.html;

            # ── API + OAuth + WebSocket → mycelia-backend (cluster DNS) ──
            location ~ ^/(api|oauth|ws) {
                proxy_pass         http://mycelia-backend:5173;
                proxy_http_version 1.1;
                proxy_set_header   Host              $host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
                proxy_set_header   Upgrade           $http_upgrade;
                proxy_set_header   Connection        $connection_upgrade;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            # ── SPA static assets (verbatim from upstream image) ──
            location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control $cache_control_header always;
            }

            location ~* \.(?:css|js|mjs|map|json|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
                try_files $uri =404;
                access_log off;
                add_header Cache-Control $cache_control_header always;
            }

            location = /favicon.ico { log_not_found off; access_log off; }
            location = /robots.txt  { log_not_found off; access_log off; }

            error_page 404 /index.html;
        }
    }
