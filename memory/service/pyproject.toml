[project]
name = "memory-service"
version = "0.1.0"
description = "Ushadow memory service (L3): memory port, proof and human-wins side tables, pluggable knowledge engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "motor>=3.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The Graphiti engine. Pinned: the API facts in memory/spike/README.md were verified on this exact version.
graphiti = ["graphiti-core==0.31.2"]

[project.scripts]
memory-rebuild = "memory_service.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
    "pyyaml>=6",  # only to import a local taskfacts checkout in the optional adapter test
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["mongo: needs a real MongoDB (set MEMORY_TEST_MONGO_URI)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/memory_service/schema/life_datatypes.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "PLR0913"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]
