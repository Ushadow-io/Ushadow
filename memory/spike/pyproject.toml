[project]
name = "s1-graphiti-spike"
version = "0.0.0"
description = "Throw-away S1 evaluation harness for Graphiti as the Ushadow memory engine"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned: the API facts in README.md were verified against this exact source.
    "graphiti-core==0.31.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
