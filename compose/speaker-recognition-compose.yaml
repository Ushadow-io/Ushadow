# Speaker Recognition Service Definition
# Speaker diarization and identification (PyAnnote), with a web UI for enrollment.
#
# The service needs an NVIDIA GPU. In k8s the GPU limit schedules it on the GPU node.
# Source: chronicle/extras/speaker-recognition (image built from Dockerfile-k8s).

# =============================================================================
# USHADOW METADATA (ignored by Docker, read by ushadow backend)
# =============================================================================
x-ushadow:
  speaker-recognition:
    # Implements the 'pyannote' speaker_recognition provider, so consumers
    # (Chronicle) get SPEAKER_SERVICE_URL from the wiring.
    provider_id: pyannote
    display_name: "Speaker Recognition"
    description: "Speaker diarization and identification with GPU acceleration"
    requires: []
    tags: ["audio", "speaker-id", "diarization", "gpu"]
    k8s_resources:
      limits:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
      requests:
        cpu: "500m"
        memory: "2Gi"
    exposes:
      - name: http_api
        type: http
        path: /
        port: 8085
      - name: health
        type: health
        path: /health
        port: 8085
  speaker-recognition-webui:
    display_name: "Speaker Recognition Web UI"
    description: "Web interface for speaker enrollment, annotation, and inference"
    requires: []
    exposes:
      - name: webui
        type: http
        path: /
        port: 5173

services:
  speaker-recognition:
    image: ${SPEAKER_REC_IMAGE:-anubis:32000/speaker-recognition}:${SPEAKER_REC_VERSION:-2026-11-07_18-02-55}
    build:
      context: ../chronicle/extras/speaker-recognition
      dockerfile: Dockerfile-k8s
    container_name: ${COMPOSE_PROJECT_NAME:-ushadow}-speaker-recognition
    ports:
      - "8085:8085"
    volumes:
      - speaker_model_cache:/models
      - speaker_audio_chunks:/app/audio_chunks
      - speaker_data:/app/data
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - COMPUTE_MODE=${COMPUTE_MODE:-cu126}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.15}
      - SPEAKER_SERVICE_HOST=0.0.0.0
      - SPEAKER_SERVICE_PORT=8085
      - BACKEND_API_URL=${BACKEND_API_URL:-http://chronicle-backend:8000}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
    networks:
      - ushadow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model loading takes time
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  speaker-recognition-webui:
    image: ${SPEAKER_REC_UI_IMAGE:-anubis:32000/speaker-recognition-ui}:${SPEAKER_REC_VERSION:-2026-11-07_18-02-55}
    build:
      context: ../chronicle/extras/speaker-recognition/webui
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ushadow}-speaker-webui
    ports:
      - "5173:5173"
    environment:
      - REACT_UI_HOST=0.0.0.0
      - REACT_UI_PORT=5173
      - REACT_UI_HTTPS=false
      - SPEAKER_SERVICE_HOST=speaker-recognition
      - SPEAKER_SERVICE_PROXY_HOST=speaker-recognition
      - SPEAKER_SERVICE_PORT=8085
      - VITE_ALLOWED_HOSTS=${SPEAKER_WEBUI_ALLOWED_HOSTS:-localhost 127.0.0.1 .ts.net}
    networks:
      - ushadow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  speaker_model_cache:
    driver: local
  speaker_audio_chunks:
    driver: local
  speaker_data:
    driver: local

networks:
  ushadow-network:
    name: ushadow-network
    external: true
