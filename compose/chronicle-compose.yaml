# Chronicle backend service definition with separate workers
# Environment variables are passed directly via docker compose subprocess env
# No .env files needed - CapabilityResolver provides all values
#
# Image Strategy:
#   - Submodule checked out: Builds from local source (./chronicle)
#   - Submodule missing: Pulls pre-built images from ghcr.io/ushadow-io/chronicle/*
#   - Uses pull_policy: build to prefer local builds when context exists

# =============================================================================
# USHADOW METADATA (ignored by Docker, read by ushadow backend)
# =============================================================================
x-ushadow:
  # Services share namespace with main ushadow for unified auth (AUTH_SECRET_KEY)
  chronicle-backend:
    display_name: "Chronicle api"
    description: "AI-powered voice journal and life logger with transcription and LLM analysis"
    requires: [llm, transcription]
    optional: [memory, speaker_recognition]  # Uses them if available, works without them
    # The selected LLM goes only to LLM_*; Chronicle's chat model reads those.
    # OPENAI_* stay on OpenAI for embeddings and the fallback LLM.
    capability_env_mappings:
      llm:
        api_key: LLM_API_KEY
        base_url: LLM_BASE_URL
        model: LLM_MODEL
    # Pod labels for NetworkPolicies: chakra-3eye 'allow-mem0-api-from-labeled'
    # admits mem0-api; chakra-sacral 'gpu-coordinator' admits the GPU LLM.
    k8s_pod_labels:
      access-mem0: "true"
      access-gpu: "true"
    tags: ["voice", "journal", "ai", "transcription", "conversation", "audio"]
    # route_path: /chronicle  # Tailscale Serve route - all /chronicle/* requests go here
    exposes:
      - name: audio_intake
        type: audio
        path: /ws/audio
        port: 8000  # Internal container port
        metadata:
          # Opus-only protobuf protocol. The Ushadow relay passes it through
          # and unwraps the Opus packets for Wyoming destinations (Mycelia).
          protocol: chronicle.audio.v2
          formats: [opus]
      - name: http_api
        type: http
        path: /
        port: 8000
      - name: health
        type: health
        path: /health
        port: 8000
  chronicle-workers:
    display_name: "Chronicle Workers"
    description: "Background workers for Chronicle (transcription, memory, audio processing)"
    requires: [llm, transcription]
    optional: [speaker_recognition]
    capability_env_mappings:
      llm:
        api_key: LLM_API_KEY
        base_url: LLM_BASE_URL
        model: LLM_MODEL
    # The 'memory' RQ queue writes extracted memories to mem0-api in chakra-3eye;
    # the timeline and memory agents call the GPU LLM in chakra-sacral.
    k8s_pod_labels:
      access-mem0: "true"
      access-gpu: "true"
    k8s_resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "100m"
        memory: "2Gi"
  chronicle-webui:
    display_name: "Chronicle Web UI"
    description: "Web interface for Chronicle voice journal"
    requires: []
    # Open the web UI already signed in: Ushadow mints a token for this audience
    # and passes it as #token=; the web UI exchanges it for a session.
    login_handoff: chronicle
    # The web UI calls its own origin for the API, so its ingress sends the
    # backend paths to chronicle-backend (the split Chronicle's Caddyfile does).
    k8s_ingress_routes:
      - { path: /api, service: chronicle-backend, port: 8000 }
      - { path: /auth, service: chronicle-backend, port: 8000 }
      - { path: /users, service: chronicle-backend, port: 8000 }
      - { path: /ws, service: chronicle-backend, port: 8000 }
      - { path: /health, service: chronicle-backend, port: 8000 }
      - { path: /readiness, service: chronicle-backend, port: 8000 }
      - { path: /audio, service: chronicle-backend, port: 8000 }

services:
  chronicle-backend:
    image: ${CHRONICLE_BACKEND_IMAGE:-ghcr.io/ushadow-io/chronicle-backend:latest}
    build:
      context: ../chronicle/backend
      dockerfile: Dockerfile
      target: dev
    pull_policy: build  # Build from source if context exists, otherwise pull from GHCR
    container_name: ${COMPOSE_PROJECT_NAME:-ushadow}-chronicle-backend
    ports:
      - "${CHRONICLE_BACKEND_PORT:-8090}:8000"
    environment:
      # MongoDB Configuration (component-based)
      - MONGODB_HOST=${MONGODB_HOST:-mongo}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USER=${MONGODB_USER:-}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-ushadow}
      - MONGODB_AUTH_SOURCE=${MONGODB_AUTH_SOURCE:-admin}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - QDRANT_BASE_URL=${QDRANT_BASE_URL:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}


      # LLM capability (from selected provider) - REQUIRED
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

      # Transcription capability (from selected provider)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-deepgram}
      # Speaker recognition (optional). Empty = Chronicle skips speaker identification.
      - SPEAKER_SERVICE_URL=${SPEAKER_SERVICE_URL:-}
      # Memory capability (optional, from selected provider)
      - MEMORY_PROVIDER=${MEMORY_PROVIDER:-chronicle}
      - MEMORY_SERVER_URL=${MEMORY_SERVER_URL:-}
      - OPENMEMORY_USER_ID=${ADMIN_EMAIL:-admin@example.com}

      # Security (from settings) - AUTH_SECRET_KEY is required for JWT auth
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ACCEPTED_ISSUERS=${ACCEPTED_ISSUERS:-ushadow,chronicle}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

      

    volumes:
      # Data persistence
      - chronicle_audio:/app/audio_chunks
      - chronicle_data:/app/data
      - chronicle_debug:/app/debug_dir

      # Config directory - contains config files, feature flags, secrets, etc.
      # Mount entire ushadow config directory to override built-in configs
      - ${PROJECT_ROOT}/config:/app/config:ro

    networks:
      - ushadow-network

    # NOTE: Depends on shared infrastructure services (mongo, redis, qdrant)
    # These must be started separately via docker-compose.infra.yml
    # Cannot use depends_on for services in external compose files

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  chronicle-workers:
    image: ${CHRONICLE_BACKEND_IMAGE:-ghcr.io/ushadow-io/chronicle-backend:latest}
    build:
      context: ../chronicle/backend
      dockerfile: Dockerfile
      target: prod
    pull_policy: build  # Build from source if context exists, otherwise pull from GHCR
    container_name: ${COMPOSE_PROJECT_NAME:-ushadow}-chronicle-workers
    command: ["python", "worker_orchestrator.py"]
    environment:
      # Infrastructure connections
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # MongoDB Configuration (component-based)
      - MONGODB_HOST=${MONGODB_HOST:-mongo}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USER=${MONGODB_USER:-}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-ushadow}
      - MONGODB_AUTH_SOURCE=${MONGODB_AUTH_SOURCE:-admin}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - QDRANT_BASE_URL=${QDRANT_BASE_URL:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}

      # LLM capability
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

      # Transcription capability
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      # - PARAKEET_ASR_URL=${PARAKEET_ASR_URL}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-deepgram}
      # Speaker recognition (optional). Empty = Chronicle skips speaker identification.
      - SPEAKER_SERVICE_URL=${SPEAKER_SERVICE_URL:-}
           # Memory capability (optional, from selected provider)
      - MEMORY_PROVIDER=${MEMORY_PROVIDER:-chronicle}
      - MEMORY_SERVER_URL=${MEMORY_SERVER_URL:-}
      - OPENMEMORY_USER_ID=${ADMIN_EMAIL:-admin@example.com}

      # Worker orchestrator configuration
      - WORKER_CHECK_INTERVAL=${WORKER_CHECK_INTERVAL:-10}
      - MIN_RQ_WORKERS=${MIN_RQ_WORKERS:-6}
      - WORKER_STARTUP_GRACE_PERIOD=${WORKER_STARTUP_GRACE_PERIOD:-30}
      - WORKER_SHUTDOWN_TIMEOUT=${WORKER_SHUTDOWN_TIMEOUT:-30}

    volumes:
      # Data persistence (shared with backend)
      - chronicle_audio:/app/audio_chunks
      - chronicle_data:/app/data
      - chronicle_debug:/app/debug_dir

      # Config directory
      - ${PROJECT_ROOT}/config:/app/config:ro

    networks:
      - ushadow-network

    restart: unless-stopped

  chronicle-webui:
    image: ${CHRONICLE_WEBUI_IMAGE:-ghcr.io/ushadow-io/chronicle/webui:latest}
    build:
      context: ../chronicle
      dockerfile: ../docker/chronicle-webui/Dockerfile
    pull_policy: build  # Build from source if context exists, otherwise pull from GHCR
    container_name: ${COMPOSE_PROJECT_NAME:-ushadow}-chronicle-webui
    ports:
      - "${CHRONICLE_WEBUI_PORT:-3080}:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:${CHRONICLE_PORT:-8090}
      - BACKEND_URL=${CHRONICLE_BACKEND_URL:-http://chronicle-backend:8000}
    networks:
      - ushadow-network
    depends_on:
      - chronicle-backend
    restart: unless-stopped

# Chronicle data volumes (local to this environment)
volumes:
  chronicle_audio:
    driver: local
  chronicle_data:
    driver: local
  chronicle_debug:
    driver: local

# Use existing shared infrastructure network
networks:
  ushadow-network:
    name: ushadow-network
    external: true
