[project]
name = "ledger"
version = "0.2.0"
description = "Ushadow ledger: evidence, moments (M1) and conversations (M2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "motor>=3.5",
    "httpx>=0.27",
    "mcp==2.3.0",
    "pyjwt>=2.8",
]

[project.scripts]
ledger-replay = "ledger.replay:main"
ledger-day = "ledger.day_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "real_mongo: runs against a real MongoDB (set LEDGER_TEST_MONGO_URI; skipped when unset)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/ledger/schema/life_datatypes.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "PLR0913"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
